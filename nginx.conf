map $http_cf_connecting_ip $real_client_ip {
  "" $binary_remote_addr;
  default $http_cf_connecting_ip;
}

limit_req_zone $real_client_ip zone=krono_req:10m rate=15r/s;
limit_conn_zone $real_client_ip zone=krono_conn:10m;

server {
  listen 80;
  server_name _;

  server_tokens off;
  client_max_body_size 1k;
  client_body_timeout 5s;
  client_header_timeout 5s;
  send_timeout 10s;

  limit_req zone=krono_req burst=30 nodelay;
  limit_conn krono_conn 25;
  limit_req_status 429;

  if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
  }

  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/security-headers.conf;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  location ~ /\. {
    deny all;
    return 404;
  }

  location ~* \.(env|git|bak|sql|jks|pem|key|sh)$ {
    deny all;
    return 404;
  }

  location = /api/releases.json {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  location = /releases/latest/download/Krono-latest.apk {
    return 302 https://github.com/IsaacNilsonViana/krono-lp/releases/download/v1.4.0/Krono-v1.4.0.apk;
  }

  location ^~ /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
